[package]
name = "confluence-cli"
version = "0.1.0"
edition = "2021"
description = "Rust migration workspace for confluence-cli"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dialoguer = "0.12"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "multipart"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "confluence-cli"
path = "src/main.rs"
